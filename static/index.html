<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Chess Analyzer</h1>

  <section id="loader-view">
    <h2>Game loader</h2>
    <label>
      Chess.com username
      <input id="username" type="text" autocomplete="username" />
    </label>
    <label>
      Year
      <input id="year" type="number" min="2000" max="2100" />
    </label>
    <label>
      Month
      <input id="month" type="number" min="1" max="12" />
    </label>
    <label>
      Depth
      <input id="depth" type="number" min="5" max="30" value="15" />
    </label>
    <button id="load-games" type="button">Load games</button>
    <span id="status"></span>

    <h2>Games</h2>
    <div id="games"></div>
  </section>

  <section id="analysis-view" hidden>
    <button id="back" type="button">Back</button>
    <h2>Analysis</h2>
    <div id="game-meta"></div>
    <span id="analysis-status"></span>
    <div class="row">
      <div>
        <div id="board"></div>
        <div>
          <button id="prev" type="button">Prev</button>
          <button id="next" type="button">Next</button>
          <button id="start" type="button">Start</button>
          <button id="end" type="button">End</button>
        </div>
        <label>
          <input id="show-best" type="checkbox" checked />
          Show best move
        </label>
        <pre id="eval-info"></pre>
      </div>
      <div>
        <table id="moves-table">
          <thead>
            <tr>
              <th>#</th>
              <th id="white-header">White</th>
              <th id="black-header">Black</th>
            </tr>
          </thead>
          <tbody id="moves-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
